# wrangler.toml
#
# Cloudflare Workers 設定（WORK-001 共通基盤）
#
# 環境方針: Local / DEV / Production の 3 環境（ADR-012_DEV_ENVIRONMENT が ADR-011 を supersede）。
#   - Production: top-level 設定（main → Production Worker → https://shingo-camera.com/*）。本セクションは不変。
#   - DEV: 末尾の [env.dev]（develop → DEV Worker → https://shingo-camera.com/dev/*）。
#   旧: ADR-011_LOCAL_AND_PRODUCTION_ONLY（Local/Production のみ）は ADR-012 で更新済み（記録は残す）。
#
# 非公開の維持方法:
#   workers.dev の標準ドメインで到達可能にし、公開用カスタムドメインは
#   紐付けない。公開時に routes / custom domain を追加する。
#
# 秘密情報はこのファイルへ書かない。`wrangler secret put` で登録する。
#   設計根拠: SECURITY.md 2, CLAUDE.md「秘密キーのフロント埋込」禁止

name = "shingo-camera-platform"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Production はカスタムドメイン https://shingo-camera.com を正規入口とする。
# *.workers.dev は公開経路を一本化するため無効化する。
workers_dev = false

# Dashboard で管理している Production の通常環境変数（SUPABASE_URL /
# SUPABASE_ANON_KEY 等）を、wrangler deploy 時に削除・上書きしない。
#   背景: wrangler は [vars] を宣言的に同期するため、toml に無い変数を
#         deploy が消してしまう。keep_vars=true で Dashboard 設定を保持する。
#   これにより npm run deploy（--keep-vars を書かなくても）で保持される。
#   秘密情報は引き続き Secret（wrangler secret put）で管理する。
keep_vars = true

# 通常の環境変数（秘密情報ではない）。
# APP_ENV は /api/health の environment 表示等に使う実行環境識別子。
# Production ではこの値(production)が使われる。
# Local(wrangler dev)では .dev.vars の APP_ENV=local が優先される。
#
# SUPABASE_URL / SUPABASE_ANON_KEY はここへ書かない（実値・プレースホルダとも）。
#   Local     : .dev.vars に記入（Git 除外）
#   Production : Cloudflare 側の環境変数として登録（wrangler で設定、または
#               ダッシュボードの Settings > Variables and Secrets）
# コードは env.SUPABASE_URL / env.SUPABASE_ANON_KEY で参照する。
# SUPABASE_SERVICE_ROLE_KEY は Secret として別管理し、フロントへ渡さない。
[vars]
APP_ENV = "production"

# APP_BASE_URL: Stripe の success_url / cancel_url を生成する固定オリジン（非秘密）。
#   request.url.origin を使わない理由: 同一 operation の retry で origin が揺れると
#   Stripe create パラメータ（idempotency 前提）が変わるため、環境固定値を正本にする。
#   実値（Production の公開 URL）はこのリポジトリに含めない運用のため、以下のいずれかで設定する:
#     - Production: 下行のコメントを外し実 URL を記入するか、Dashboard の Variables で APP_BASE_URL を設定
#                   （keep_vars=true のため Dashboard 設定は deploy で保持される）
#     - Local     : .dev.vars に APP_BASE_URL=http://localhost:8787 を記入（.dev.vars.example 参照）
#   例: APP_BASE_URL = "https://platform.example.com"
# APP_BASE_URL = "https://<本番の公開URL>"
APP_BASE_URL = "https://shingo-camera.com"
# Workers Static Assets（WORK-003）
#
# 責務分担:
#   /api/*   → Worker を先に実行（run_worker_first）
#   それ以外 → public/ 配下の静的ファイルを配信
#
# html_handling = "auto-trailing-slash":
#   /login → /login/ へ正規化し、public/login/index.html を返す。
# not_found_handling = "none":
#   存在しない通常画面は Static Assets 側の 404。SPA フォールバックはしない。
#
# ASSETS binding は Worker から静的ファイルを明示取得しないため追加しない。
[assets]
directory = "./public"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# 観測性を有効化し、内部エラー等をログで確認できるようにする。
# 設計根拠: SECURITY.md 10「内部詳細は Cloudflare ログへ記録」
[observability]
enabled = true

# Cloudflare D1 バインディング（WORK-002）
#
# database_id は作成済み D1 の実値。これはリソース識別子であり秘密情報では
# ないため wrangler.toml で管理する（Cloudflare 標準の運用）。
# この値を維持すること（プレースホルダへ戻さない）。
#   設計根拠: DATABASE.md, WORK-002_D1_SETUP.md
#
# migration は migrations/ ディレクトリを使用する。
#   local 適用   : wrangler d1 migrations apply shingo-camera-platform --local
#   production適用: wrangler d1 migrations apply shingo-camera-platform --remote
[[d1_databases]]
binding = "DB"
database_name = "shingo-camera-platform"
database_id = "52a29812-4239-4dc5-985b-a77cffca09ae"
migrations_dir = "migrations"

# 環境変数・Secrets は後続 WORK で追加する。
# 例は .dev.vars.example / README.md を参照。
# 実際の Secrets はコードにも Git にも保存しない。

# Cron Trigger（WORK-009 Warning Notification）
#
# 1 時間ごとに scheduled ハンドラ（src/index.ts）を起動し、Warning を判定・通知する。
#   設計根拠: operation/WARNING.md 6「初期頻度: 1時間ごと」, WORK-009_WARNING.md
# 既存の keep_vars / [vars] / [assets] / [observability] / [[d1_databases]] /
# database_id には影響しない（本セクションの追加のみ）。
[triggers]
crons = ["0 * * * *"]

# ============================================================================
# DEV 環境（[env.dev]）— WORK: 正式 DEV 環境（ADR-012）
# ----------------------------------------------------------------------------
# 重要:
#   - このセクションは `wrangler deploy --env dev` の時だけ使う。top-level（Production）は不変。
#   - Production 経路（custom domain / D1 / Route / main の自動 deploy）は一切変更しない。
#   - env は top-level を継承しないため、DEV に必要な binding/vars/route/assets を明示する。
#   - DEV binding/secret 不足時は Production へ fallback せず fail-closed（コード側 shim も同様）。
#
# 人間手順（Claude は実行しない）:
#   1) DEV D1 作成: `wrangler d1 create shingo-camera-platform-dev` → 出力 id を下の database_id へ。
#   2) DEV Secrets: `wrangler secret put STRIPE_SECRET_KEY --env dev`（sk_test_...）等（DEV_SECRETS.md）。
#   3) Route `shingo-camera.com/dev/*` を DEV Worker へ（Cloudflare Dashboard / 下記 routes）。
#   4) Cloudflare Access で `shingo-camera.com/dev/*` を メール allowlist 保護。
#   5) Workers Builds: develop branch → `wrangler deploy --env dev`。
[env.dev]
name = "shingo-camera-platform-dev"

# /dev/* だけを DEV Worker が受ける。Production の custom domain は変更しない（Route が優先）。
# zone_name はカスタムドメインのゾーン。実ゾーン名に合わせること。
routes = [
  { pattern = "shingo-camera.com/dev/*", zone_name = "shingo-camera.com" }
]

# DEV Worker は /dev/* を Worker 先行処理（shim が prefix 除去・ASSETS 配信・noindex 付与）。
[env.dev.assets]
directory = "./public"
binding = "ASSETS"                     # 非 API を public/ から配信するため Worker から明示取得する
run_worker_first = ["/dev/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[env.dev.observability]
enabled = true

# DEV 用 通常変数（非秘密）。DEV_BASE_PATH の存在が shim を有効化する（Production には無い）。
[env.dev.vars]
APP_ENV = "development"
DEV_BASE_PATH = "/dev"
APP_BASE_URL = "https://shingo-camera.com/dev"
# Cloudflare Access（Zero Trust）JWT の Worker 側本検証用（非秘密の識別子）。人間手順で実値へ置換。
#   DEV_ACCESS_TEAM_DOMAIN: 例 "myteam"（→ https://myteam.cloudflareaccess.com が issuer）。
#   DEV_ACCESS_AUD: Access Application の Audience(AUD) タグ。
DEV_ACCESS_TEAM_DOMAIN = "frosty-paper-99da"
DEV_ACCESS_AUD = "d8befeef5f9dd40ea1112fc4e817498d45071e8aa064414991ffedc5770a1430"

# DEV 専用 D1（Production D1 と完全分離）。database_id は human 手順 1) で作成し置換する。
#   ※ Production の database_id（52a29812-...）は絶対に流用しない。
[[env.dev.d1_databases]]
binding = "DB"
database_name = "shingo-camera-platform-dev"
database_id = "bb13ba2a-5d3a-4aa7-86ae-c44904cd5102"   # ← wrangler d1 create の出力で置換
migrations_dir = "migrations"

# DEV では Warning cron は動かさない（Production 通知系へ影響させない）。必要になれば別途追加する。
# Secrets（STRIPE_SECRET_KEY=sk_test / STRIPE_WEBHOOK_SECRET=Test / SUPABASE_* / SESSION_ID_HASH_SECRET 等）は
#   `wrangler secret put <NAME> --env dev` で DEV Worker にのみ登録する（Git/toml に書かない）。

# DEVではProductionのWarning cronを実行しない。
[env.dev.triggers]
crons = []
