<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="robots" content="noindex" />
  <title>新しいパスワードの設定 | shingo-camera Platform</title>
  <link rel="stylesheet" href="/assets/common.css" />
  <link rel="stylesheet" href="/assets/auth.css" />
</head>
<body data-page="reset">
  <div class="wrap">
    <div class="card">
      <p class="brand">shingo-camera Platform</p>
      <h1>新しいパスワードの設定</h1>

      <label for="password">新しいパスワード</label>
      <input id="password" type="password" autocomplete="new-password" />
      <p class="hint">メール内リンクからこの画面へアクセスした状態で設定してください。</p>

      <button id="submit" type="button">パスワードを更新</button>

      <p id="msg" class="msg"></p>

      <div class="links">
        <a href="/login/">ログインへ</a>
      </div>
    </div>
  </div>

  <script src="/assets/vendor/supabase.js"></script>
  <script src="/assets/auth.js"></script>
</body>
</html>
