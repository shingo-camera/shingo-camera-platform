<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<title>購入完了の確認</title>
<link rel="stylesheet" href="/assets/common.css" />
<style>
  .purchase-box { max-width: 480px; margin: 60px auto; padding: 24px; text-align: center; }
  .status { margin: 20px 0; font-size: 16px; }
  .status.ok { color: var(--ok, #4fd18b); }
  .status.pending { color: var(--muted, #9aa0aa); }
  .spinner { margin: 16px auto; width: 28px; height: 28px; border: 3px solid var(--border, #2a2f3a); border-top-color: var(--accent, #4f8cff); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .product-list { margin: 20px auto 0; max-width: 360px; text-align: left; }
  .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border, #2a2f3a); font-size: 14px; }
  .product-item .pname { color: var(--text, #e6e8ec); }
  .product-item .pstate { font-size: 13px; }
  .product-item .pstate.ok { color: var(--ok, #4fd18b); }
  .product-item .pstate.pending { color: var(--muted, #9aa0aa); }
  .actions { margin-top: 24px; }
  .actions a { color: var(--accent, #4f8cff); text-decoration: none; }
</style>
</head>
<body>
<div class="purchase-box">
  <h1>ご購入ありがとうございます</h1>
  <div id="status" class="status pending">決済情報を確認しています…</div>
  <div id="spinner" class="spinner"></div>
  <div id="product-list" class="product-list" style="display:none;"></div>
  <div class="actions">
    <a href="/store/">ストアへ戻る</a>
  </div>
</div>

<script src="/assets/vendor/supabase.js"></script>
<script>
(async function () {
  var statusEl = document.getElementById("status");
  var spinner = document.getElementById("spinner");
  var listEl = document.getElementById("product-list");

  // 進行中 Checkout の記録は「今回の Session が本人のものと確認でき、かつ現在の pending が
  // 今回の operationId と一致する場合のみ」削除する。無条件削除は、古い success タブを後から
  // 開いた際に別の新しい Checkout の pending を消してしまうため行わない。
  function clearPendingIfMatches(opId) {
    if (!opId) return;
    try {
      var v = localStorage.getItem("shingo_pending_checkout");
      var p = v ? JSON.parse(v) : null;
      if (p && p.operationId === opId) {
        localStorage.removeItem("shingo_pending_checkout");
      }
    } catch (e) { /* noop */ }
  }

  // success_url に付与された session_id を取得（Stripe が {CHECKOUT_SESSION_ID} を展開）。
  // 購入完了の判定は「今回この Session で購入した商品が全て反映されたか」で行う。
  // URL では購入済みとみなさず、サーバー（recover / entitlement）を正本にする。
  var params = new URLSearchParams(location.search);
  var sessionId = params.get("session_id");

  var deviceId = (function () {
    try {
      var k = "scp_device_id", v = localStorage.getItem(k);
      if (!v) { v = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()); localStorage.setItem(k, v); }
      return v;
    } catch (e) { return String(Date.now()); }
  })();

  async function getToken() {
    var res = await fetch("/api/config", { headers: { "X-Device-Id": deviceId } });
    if (!res.ok) return null;
    var body = await res.json();
    if (!self.supabase || !self.supabase.createClient) return null;
    var client = self.supabase.createClient(body.data.supabaseUrl, body.data.supabaseAnonKey);
    var s = await client.auth.getSession();
    return s && s.data && s.data.session ? s.data.session.access_token : null;
  }

  var token = await getToken();
  if (!token) {
    statusEl.textContent = "購入状態を確認するにはログインが必要です。";
    spinner.style.display = "none";
    // ログイン後、同じ success URL（session_id 付き）へ戻す。既存 login redirect 機構を利用。
    var back = location.pathname + location.search;
    var a = document.createElement("a");
    a.href = "/login/?redirect=" + encodeURIComponent(back);
    a.textContent = "ログインして購入状態を確認する";
    a.className = "login-cta";
    listEl.appendChild(a);
    listEl.style.display = "block"; // 初期 display:none のため、LOGIN 導線を確実に表示する
    return;
  }
  var authHeaders = { Authorization: "Bearer " + token, "X-Device-Id": deviceId };

  // 商品名（表示用）を /api/products から取得（無ければ code 表示）
  var nameByCode = {};
  try {
    var pres = await fetch("/api/products", { headers: { "X-Device-Id": deviceId } });
    if (pres.ok) {
      var pbody = await pres.json();
      ((pbody && pbody.data && pbody.data.products) || []).forEach(function (p) { nameByCode[p.code] = p.name; });
    }
  } catch (e) {}
  function displayName(code) { return nameByCode[code] || code; }

  // recover API: session_id から「今回購入した商品コード（purchasedCodes）」を取得する。
  // これが success 画面の追跡対象（全商品 granted で完了）の正本。
  // paid 反映が Webhook 待ちの場合に備え、数回リトライして purchasedCodes を確定する。
  async function recoverOnce() {
    if (!sessionId) return { ok: false, codes: [] };
    try {
      var res = await fetch("/api/purchases/recover", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders),
        body: JSON.stringify({ sessionId: sessionId }),
      });
      var body = null;
      try { body = await res.json(); } catch (e) {}
      if (res.ok && body && body.data) {
        return { ok: true, result: body.data.result, codes: body.data.purchasedCodes || [], operationId: body.data.operationId || null };
      }
      // 403（他人 Session）等
      if (res.status === 403) return { ok: false, forbidden: true, codes: [] };
      return { ok: false, codes: [] };
    } catch (e) {
      return { ok: false, codes: [] };
    }
  }

  // 今回の対象商品コードを確定（recover を最大 3 回試行）
  var targetCodes = [];
  var forbidden = false;
  var recoverOperationId = null;
  for (var t = 0; t < 3; t++) {
    var rr = await recoverOnce();
    if (rr.forbidden) { forbidden = true; break; }
    if (rr.operationId) recoverOperationId = rr.operationId;
    if (rr.codes && rr.codes.length > 0) { targetCodes = rr.codes; break; }
    // paid 未反映の可能性 → 少し待って再試行
    await new Promise(function (r) { setTimeout(r, 1500); });
  }
  // 本人の Session と確認でき、今回の operationId が現在の pending と一致する場合のみ削除。
  clearPendingIfMatches(recoverOperationId);

  if (forbidden) {
    statusEl.className = "status pending";
    statusEl.textContent = "この購入情報にはアクセスできません。";
    spinner.style.display = "none";
    return;
  }

  function renderProducts(rows) {
    listEl.style.display = "block";
    listEl.innerHTML = "";
    rows.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "product-item";
      var nm = document.createElement("span");
      nm.className = "pname";
      nm.textContent = displayName(p.code);
      var st = document.createElement("span");
      st.className = "pstate " + (p.ok ? "ok" : "pending");
      st.textContent = p.ok ? "利用可能" : "反映確認中";
      row.appendChild(nm); row.appendChild(st);
      listEl.appendChild(row);
    });
  }

  // account/products の available を code→bool で引く
  async function fetchAvailableMap() {
    try {
      var res = await fetch("/api/account/products", { headers: authHeaders });
      if (!res.ok) return null;
      var body = await res.json();
      var map = {};
      ((body.data && body.data.products) || []).forEach(function (p) {
        map[p.code] = (p.available === true) || (p.granted === true);
      });
      return map;
    } catch (e) { return null; }
  }

  var maxAttempts = 5;
  var delayMs = 2000;

  async function check(attempt) {
    var map = await fetchAvailableMap();

    // 追跡対象が確定していない場合（recover が purchasedCodes を返せなかった）は、
    // 全商品 granted による誤判定を避け、確定できるまで待つ（安全側）。
    if (targetCodes.length === 0) {
      if (attempt < maxAttempts) {
        statusEl.textContent = "決済状況を確認しています…（" + attempt + "/" + maxAttempts + "）";
        setTimeout(function () { check(attempt + 1); }, delayMs);
      } else {
        // purchasedCodes を確定できていないため、決済状態を断定しない。
        statusEl.className = "status pending";
        statusEl.textContent = "決済状況と利用権限の反映を確認中です。時間をおいて再度ご確認ください。";
        spinner.style.display = "none";
      }
      return;
    }

    // 今回購入した商品「だけ」を対象に反映状況を描画
    var rows = targetCodes.map(function (c) { return { code: c, ok: !!(map && map[c]) }; });
    renderProducts(rows);

    // 全ての対象商品が available になった場合のみ購入完了
    var allOk = rows.length > 0 && rows.every(function (r) { return r.ok; });
    if (allOk) {
      statusEl.className = "status ok";
      statusEl.textContent = "購入が完了し、ご利用いただけます。";
      spinner.style.display = "none";
      return;
    }

    if (attempt < maxAttempts) {
      statusEl.textContent = "決済情報を確認しています…（" + attempt + "/" + maxAttempts + "）";
      setTimeout(function () { check(attempt + 1); }, delayMs);
    } else {
      statusEl.className = "status pending";
      statusEl.textContent = "決済は完了していますが、一部商品の反映を確認中です。時間をおいて再度ご確認ください。";
      spinner.style.display = "none";
    }
  }

  check(1);
})();
</script>
</body>
</html>
