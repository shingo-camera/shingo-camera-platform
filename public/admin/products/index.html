<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1024" />
<meta name="robots" content="noindex" />
<title>管理コンソール | 商品</title>
<link rel="stylesheet" href="/assets/site.css" />
<link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
<header id="site-header" class="site-header"></header>
<header class="admin-header">
  <h1>管理コンソール</h1>
  <nav>
    <a href="/admin/">ダッシュボード</a>
    <a href="/admin/users/">ユーザー</a>
    <a href="/admin/warnings/">Warning</a>
    <a href="/admin/note/">note移行</a>
    <a href="/admin/products/">商品</a>
  </nav>
</header>
<main>
  <h2>商品一覧</h2>
  <div class="notice">商品編集機能は未実装です（閲覧のみ）。商品名・表示順・状態の変更はできません。</div>
  <div id="result"></div>
</main>

<script src="/assets/api-base.js"></script>
<script src="/admin/assets/vendor/supabase.js"></script>
<script src="/admin/assets/admin.js"></script>
<script>
(async function () {
  var A = self.AdminUI;
  var result = document.getElementById("result");
  A.setLoading(result);
  try {
    // 既存の公開 API のみ使用（管理用の商品 API は追加しない）
    var res = await apiFetch("/api/products");
    var body = await res.json();
    if (!body || body.result !== "OK") {
      throw new Error("商品情報の取得に失敗しました。");
    }
    var products = body.data.products || [];
    A.clear(result);
    if (products.length === 0) {
      result.appendChild(A.el("div", "商品がありません。", "notice"));
      return;
    }
    var table = A.el("table");
    var thead = A.el("thead");
    var htr = A.el("tr");
    ["PRODUCT_CODE", "商品名", "表示順"].forEach(function (h) { htr.appendChild(A.el("th", h)); });
    thead.appendChild(htr); table.appendChild(thead);
    var tbody = A.el("tbody");
    products.forEach(function (p) {
      var tr = A.el("tr");
      tr.appendChild(A.td(p.code));
      tr.appendChild(A.td(p.name));
      tr.appendChild(A.td(p.sortNo));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    result.appendChild(table);

    // 公開APIは有効商品(STATUS=1,DEL_FLG=0)のみ返すため、STATUS等は表示できない旨を明示
    var note = A.el("div", "※ 表示は有効な商品のみです。STATUS・DEL_FLG 等の詳細表示および編集は未実装です。", "muted");
    note.style.marginTop = "8px";
    result.appendChild(note);
  } catch (e) {
    A.setError(result, e.message);
  }
})();
</script>
<script src="/assets/site-config.js"></script>
<script src="/assets/site.js"></script>
</body>
</html>
